server:
  port: 8787
  servlet:
    context-path: /api

spring:
  profiles:
    active: local
  application:
    name: order-liability-agent
  mvc:
    async:
      # SSE 流式响应走 Servlet 异步，超时须覆盖 P1-P8 同步耗时 + P9 表达层耗时
      request-timeout: 180000
  datasource:
    # mysql配置  这里因为mysql和PGsql配置项同名了，冲突，所以手动配置
    mysql:
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://127.0.0.1:3306/order_liability_agent?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    #PGSql设置 [已在local配置文件设置，这里脱敏处理]
    pgsql:
      url: jdbc:postgresql://xxxx:5432/ai_agent
  config:
    # 关键：显式导入 .env 文件，并告诉 Spring 按 properties 格式解析它
    import: optional:file:.env[.properties]
  ai:
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        model: deepseek-flash
    ollama:
      # base-url: http://localhost:11434
      # chat:
      #   model: gemma3:270m
      embedding:
        model: qwen3-embedding:0.6b # 需要启动Ollama才能用，默认访问http://localhost:11434/api/embed
        keep-alive: 60m
      chat:
        model: qwen3:4b-instruct
        keep-alive: 60m
        num-batch:



